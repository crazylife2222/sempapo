const FR=['fã apaixonado','hater que implica e provoca','curioso que faz perguntas','crítico que aponta defeitos com argumento','fofoqueiro','memeiro de piadas e gírias','defensor que briga pelos fãs','cético desconfiado'],fanRole=x=>FR[[...String(x.id)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%FR.length];
const pubRules=c=>{const f=cs(c).filter(x=>x.fan);return '\nGRUPO PÚBLICO DE FÃS (PRIORIDADE sobre qualquer regra de cena acima): este é um chat de grupo de verdade, estilo WhatsApp, aberto a qualquer um pelo link, com muitos membros ('+pubN(c)+' no total; só os listados em PERSONAGENS estão ativos agora). Não é cena de RPG. A cada resposta falam de 6 a 12 membros diferentes, variando quem aparece, sempre com mensagens curtas (1 a 2 frases) no jeito de cada um. A MAIORIA dos balões (pelo menos dois terços) deve ser dos membros com a tag "fã" (fãs, haters, curiosos, críticos, fofoqueiros), cada um agindo pelo seu papel; os personagens do universo falam pouco, só 1 ou 2 por vez. Sempre inclua ao menos 1 hater ou crítico e 1 curioso. Quem foi marcado com @ ou chamado pelo nome responde sempre, e o primeiro balão é dele. Os membros reagem a '+S.cfg.user+' e também uns aos outros (concordam, brigam, provocam, respondem, defendem). Os fãs são pessoas comuns do grupo e não inventam parentescos nem fatos sobre os personagens do universo.'+(f.length?'\nPAPEL DE CADA FÃ: '+f.map(x=>x.nome+' ('+fanRole(x)+')').join('; ')+'.':'')};
const pubShare=t=>{String(t||'').replace(/#g=([a-z0-9]{6,12})/gi,(m,k)=>{const c=S.chats.find(z=>z.pub&&z.pub.code===k.toLowerCase());if(c){if(!c.pub.shared){c.pub.shared=1;lg(S.cfg.user+' divulgou o link do grupo público “'+title(c)+'”.');save()}setTimeout(()=>pubFill(c),2500+Math.random()*2500)}return m})};
async function pubFill(c){const P=c&&c.pub;if(!P||!P.shared||PF.has(c.id)||!S.chats.includes(c))return;PF.add(c.id);try{
 const need=()=>30-c.chars.length,pool=()=>S.npcs.filter(n=>!c.chars.includes(n.id)&&!(P.out||[]).includes(n.id));
 if(need()<=0)return;
 if(pool().length<need()&&S.cfg.key&&S.npcs.length<150){try{await genNpcs()}catch(e){}}
 const add=pool().sort(()=>Math.random()-.5).slice(0,need());
 if(!add.length){if(!S.cfg.key)toast('Cole sua chave Gemini em Perfil para os fãs entrarem pelo link.');return}
 c.att=c.att||[];add.forEach(n=>{c.att.push(fanOf(n));c.chars.push(n.id)});
 c.msgs.push({id:uid(),de:add[0].id,t:add.length>1?'🔗 '+add[0].nome+' e mais '+(add.length-1)+(add.length>2?' pessoas entraram':' pessoa entrou')+' pelo link':'🔗 '+add[0].nome+' entrou no grupo pelo link',ts:Date.now(),cl:1,jn:1});
 save();if(V.n==='chat'&&V.id===c.id){paint();sub();if($('#gl'))glinkS()}else if(V.n==='conv')cvl()
}finally{PF.delete(c.id)}}
const glinkS=()=>{const c=cur();if(!c||!c.pub)return;sheet(`<h2>🔗 Link do grupo</h2><small>Grupo público: qualquer perfil criado pela IA entra pelo link. Seus personagens só entram se você adicionar em Editar grupo.</small><div class="op"><b>👥 ${pubN(c)} membros</b><small>Sem limite de pessoas · ativos na conversa: ${cs(c).length}/30${c.pub.shared?'':' · ninguém entra até você compartilhar o link'}</small></div><input id="gl" readonly value="${esc(pubLink(c))}" onclick="this.select()"><button class="btn" data-a="glcopy">Copiar link</button><button class="btn g" data-a="glfeed">Postar no Feed</button><button class="btn g" data-a="glchat">Enviar em um chat</button><button class="btn g" data-a="close">Fechar</button>`)};
Object.assign(act,{glink:()=>{const c=cur();if(!c||c.tipo!=='grupo'||c.lugar)return;if(!c.pub){pubOn(c);save();sub()}glinkS()},
 glcopy:async()=>{const c=cur();if(!c||!c.pub)return;try{await navigator.clipboard.writeText(pubLink(c));toast('Link copiado.')}catch(e){const i=$('#gl');if(i){i.select();try{document.execCommand('copy');toast('Link copiado.')}catch(_){toast('Segure no link para copiar.')}}}},
 glfeed:()=>{const c=cur();if(!c||!c.pub)return;CP=newCP();CP.t='Entrem no meu grupo de fãs “'+title(c)+'”! 👥\n'+pubLink(c);CPp=V;sheet();go('comp')},
 glchat:()=>{const c=cur();if(!c)return;sheet('<h2>Enviar em um chat</h2><small>Escolha onde mandar o link.</small>'+(S.chats.filter(x=>x.id!==c.id).map(x=>`<div class="it" data-a="glsend" data-id="${x.id}">${x.tipo==='grupo'?gav(x,40):av(cs(x)[0]||{nome:'?'},40)}<div class="x"><b>${esc(title(x))}</b></div></div>`).join('')||'<p class="em0">Nenhum outro chat.</p>')+'<button class="btn g" data-a="glink">Voltar</button>')},
 glsend:d=>{const g=cur(),c=S.chats.find(x=>x.id===d.id);if(!g||!g.pub||!c)return;const t='Entra no meu grupo de fãs “'+title(g)+'”: '+pubLink(g);c.msgs.push({id:uid(),de:'user',t,ts:Date.now()});c.n++;pubShare(t);gx(2);save();sheet();go('chat',{id:c.id});if(!busy&&cs(c).length)respond(c)}});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href*="#g="]');if(!a)return;const m=(a.getAttribute('href')||'').match(/#g=([a-z0-9]+)/i);if(!m)return;const c=S.chats.find(z=>z.pub&&z.pub.code===m[1].toLowerCase());e.preventDefault();e.stopPropagation();if(!c)return toast('Este grupo não existe mais.');sheet();go('chat',{id:c.id})},true);
function hgOpen(){const m=location.hash.match(/#g=([a-z0-9]+)/i);if(!m)return;const c=S.chats.find(z=>z.pub&&z.pub.code===m[1].toLowerCase());try{history.replaceState({a:1},'',location.href.split('#')[0])}catch(e){}if(c)go('chat',{id:c.id});else toast('Este grupo não existe neste aparelho.')}
cleanMsgs();if(cfgOk)startAuth().catch(e=>{toast('Firebase indisponível: '+e.message);render()});else{render();hgOpen()}
setTimeout(()=>$('#splash').classList.add('o'),1000);setTimeout(()=>$('#splash').remove(),1600);
</script></body></html>
