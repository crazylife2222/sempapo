async function genNpcs(){const T=120,X=new Set((S.npcX||[]).map(x=>x.id)),bs=()=>S.npcs.filter(n=>!X.has(n.id)).length,TH=['fãs apaixonados e superfãs que comentam com muito carinho, fãs de fã-clube e "estans"','haters, críticos ácidos, invejosos, trolls, fofoqueiros e memeiros','gente comum do dia a dia (mães, tios, avós, aposentados, vizinhos, religiosos) e profissionais de várias áreas (dentista, motoboy, professora, médica, programador, advogado, cabeleireira)','adolescentes e jovens (gamers, k-popers, universitários, funkeiros, nerds, skatistas), jornalistas de entretenimento e produtores musicais'];if(bs()>=T)return;toast('Criando perfis de fãs…');let g=0;try{while(bs()<T&&g++<6){const th=TH[Math.floor(bs()/30)%TH.length],ex=S.npcs.slice(-50).map(n=>n.user).join(',');const j=jj(await gem({contents:[{role:'user',parts:[{text:`Crie 30 perfis fictícios e variados de usuários de uma rede social estilo X, brasileiros, com foco em: ${th}. Misture gêneros, idades (14 a 70 anos) e regiões do Brasil, com nomes completos e @usuários únicos e realistas (com apelidos, números, underline). Personalidades diferentes (carinhosos, irônicos, sérios, curiosos, exagerados)${ex?'. Diferentes destes @usuários: '+ex:''}. Responda SOMENTE JSON: [{"nome":"...","user":"minúsculo, sem espaço e sem @","bio":"jeito de comentar, até 12 palavras","sexo":"f ou m","idade":25}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:4096,temperature:1.2}}));(Array.isArray(j)?j:[]).forEach(o=>{const u=String(o.user||'').replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_.]/g,'');if(o.nome&&u&&bs()<T&&!S.npcs.some(n=>n.user===u))S.npcs.push({id:'n_'+uid(),nome:String(o.nome).slice(0,40),user:u,bio:String(o.bio||'').slice(0,120),seg:Math.floor(Math.random()*20000)+50,npc:1,sx:o.sexo==='m'||o.sexo==='f'?o.sexo:'',ida:Math.max(14,Math.min(80,+o.idade||30))})});save()}}catch(e){save();if(bs()<30)throw e}}

function brNum(v){v=String(v==null?'':v).replace(/[^\d.,]/g,'');if(!v)return 0;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v))v=v.replace(/,/g,'');else v=v.replace(',','.');const n=parseFloat(v);return isFinite(n)?n:0}

function stripUser(tx,c){try{const u=String(S.cfg.user||'').trim();if(!u)return tx;const f=u.split(/\s+/)[0],clash=cs(c).some(x=>nrm(x.nome)===nrm(u)||nrm(x.nome.split(' ')[0])===nrm(f));if(clash)return tx;const rx=new RegExp('^[\\s*_]*(?:'+rxe(u)+'|'+rxe(f)+')\\s*:','i');return String(tx).split('\n').filter(l=>!rx.test(l)).join('\n')}catch(e){return tx}}

const ok=j.resolvido===true||j.resolvido==='true',pp=PRODS(s).find(x=>t.prod&&x.n.toLowerCase()===t.prod.toLowerCase()),cap=pp?pp.p*2:200,cu=ok?Math.max(0,Math.min(cap,Math.round(+j.custo||0))):0;

const FSACACT={

  arr.slice(0,14).forEach(o=>{if(!o)return;let tag=String(o.tag||'').trim().replace(/\s+/g,' ').slice(0,42);if(tag.length<2)return;if(o.mut&&tag[0]!=='#')tag='#'+slug(tag);if(tag.length<3||old.has(nz(tag))||out.some(x=>nz(x.tag)===nz(tag)))return;
   const cat=String(o.cat||'Em alta').slice(0,40),desc=String(o.desc||'').slice(0,220);
   if(o.mut){const t=mkM(tag,desc,String(o.alvo||desc).slice(0,220),String(o.por||'').replace(/^@/,'').trim().slice(0,30)||fanPick().user,Math.max(20,Math.min(500,+o.meta||R(40,200))));out.push(t)}
   else out.push(mkT(tag,cat,desc,Math.max(3,Math.min(900,+o.mil||R(8,200)))))});
  if(out.length>=4){const keep=T.l.filter(t=>t.joined&&!t.done).slice(0,2);T.l=order([...keep,...out]).slice(0,12);T.ts=Date.now();T.ai=1;save();ok=true;
   const nw=out.filter(t=>t.mut).slice(0,2);nw.forEach((t,i)=>{lg('Fãs criaram o mutirão '+t.tag+': '+t.alvo);seedMut(t);if(!i)announce(t)});if(nw.length)save()}
 }catch(e){}
 TG=0;return ok}

function seedLocal(l){const m=l.find(t=>t.mut&&!t.joined);if(!m)return 0;seedMut(m);setTimeout(()=>announce(m),1200);return 1}
function ensure(){

 if(S.cfg.key&&S.cfg.auto!=='off'&&!TG&&!fb&&!window.PTVon&&(!T.ai||age>108e5)&&tr>6e5){T.try=Date.now();ch=1;aiTrends().then(ok=>{if(ok&&V.n==='feed'){paintCard();pl()}})}
 else if(!S.cfg.key&&age>108e5){T.l=localTrends();T.ts=Date.now();ch=1;sd=seedLocal(T.l)}
 if(ch)save();return sd}

 return `<div class="mb"><b style="color:#ffd77a">📣 Mutirão de fãs</b><small>Puxado por @${esc(t.por||'fã')}</small><p style="margin:6px 0">${esc(t.alvo||'')}</p><div class="pgb"><i style="width:${pc}%"></i></div><small>${fN(g*1000)} de ${fN(t.meta*1000)} posts · ${t.done?'🎉 meta batida!':'faltam '+fN(Math.max(0,t.meta-g)*1000)}</small>`
 +(t.joined?`<small style="color:#3ddc84;margin-top:6px">✅ Você está no mutirão</small><button class="btn g" data-a="trn_join" data-id="${t.id}">📣 Postar de novo</button>`:`${pc>=60?'<small style="color:#ffd77a;margin-top:6px">Falta só você pra bater a meta!</small>':''}<button class="btn" data-a="trn_join" data-id="${t.id}">📣 Entrar no mutirão</button>`)+`</div>`}

 $('#app').innerHTML=`<div id="view" style="padding-bottom:40px"><div class="top"><button class="ic" data-a="trn_back">←</button><b>${esc(t.mut?'Mutirão de fãs':t.cat)}</b><button class="ic" data-a="trn_gen" data-id="${t.id}" title="Mais posts">↻</button></div><div class="trd" id="trh"></div><div id="trp"></div></div>`;
 trendPaint();if(!GP[t.id]&&!t.gen&&!S.posts.some(p=>p.tr===t.id))genPosts(t)}

function localPosts(t){const u=S.cfg.user,h=S.cfg.handle,tg=t.tag[0]==='#'?' '+t.tag:'';
 const M=['📣 Gente, bora todo mundo postar'+tg+'! '+(t.alvo||''),'fazendo minha parte no mutirão'+tg+'. '+(t.alvo||''),'Já postei, já curti e já chamei a família inteira.'+tg,'quem ainda não postou, POSTA!'+tg+' falta pouco pra bater a meta'],
 N=['Ninguém fala de outra coisa hoje: '+t.tag+tg.replace(t.tag,''),'Entrei na timeline só pra ver isso e já perdi 1h. '+t.tag,t.tag+' está dividindo opiniões aqui em casa','A timeline hoje: '+t.tag+'. Só isso.'];
 let n=0;(t.mut?M:N).sort(()=>Math.random()-.5).slice(0,4).forEach((x,i)=>{const p=newPost(fanPick(),x,[]);if(S.posts.includes(p)){p.tr=t.id;p.ts=Date.now()-i*7*6e4;n++}});return n}
async function genPosts(t,extra){
 if(GP[t.id])return;GP[t.id]=1;trendPaint();let n=0;
 try{if(S.cfg.key){const u=S.cfg.user,h=S.cfg.handle,fans=fansL().sort(()=>Math.random()-.5).slice(0,25).map(x=>x.user+': '+String(x.bio||'').slice(0,60)).join('\n'),prev=postsOf(t).slice(0,8).map(p=>'“'+String(p.t||'').slice(0,90)+'”').join(' | ')||'nenhum',hs=t.tag[0]==='#';
  const j=await aiJ(`Assunto em alta: ${t.tag} (${t.cat}). ${t.desc||''}${t.mut?`\nÉ um MUTIRÃO DE FÃS puxado por @${t.por}: ${t.alvo}. Meta: ${t.meta} mil posts.`:''}${extra||''}
Crie 14 posts de contas DIFERENTES sobre esse assunto, no estilo do Twitter brasileiro: fãs e perfis comuns (use os usuários desta lista), páginas de notícias, memes ou fã-clube (invente o nome em "conta") e, só quando fizer sentido, personagens do universo (pelo nome). ${hs?`Todos os posts devem conter ${t.tag}.`:''} ${t.mut?`Os posts são de fãs participando do mutirão de forma concreta (ouvindo, votando, compartilhando, pedindo), sem atacar ninguém e sem "defender" ${u} de nada; cada um de um jeito, no máximo 2 marcam @${h}.`:`O assunto NÃO é sobre ${u}, a menos que a descrição diga o contrário: não force ${u} na conversa.`}
Perfis de fãs (usuário: jeito):\n${fans||'(invente)'}
Posts anteriores (não repita ideias): ${prev}
Cada post com 4 comentários curtos de autores diferentes (alguns respondendo, campo "para"). Responda SOMENTE JSON: [{"autor":"usuario do fã OU nome de personagem","conta":"(opcional) nome de página/conta nova","texto":"...","comentarios":[{"autor":"usuario","texto":"...","para":""}]}]`,16000);
  for(const o of Array.isArray(j)?j:[]){if(n>=14)break;const tx=String((o&&o.texto)||'').trim();if(!tx)continue;const nm=String(o.conta||o.autor||'').trim();let a=nm&&(res(nm)||(o.conta?npcFor(nm):null));if(!a)a=nm?npcFor(nm,'Perfil que comenta o assunto '+t.tag):fanPick();
   let x=tx;if(t.tag[0]==='#'&&!x.toLowerCase().includes(t.tag.toLowerCase()))x+=' '+t.tag;
   const p=newPost(a,x,o.comentarios);if(S.posts.includes(p)){p.tr=t.id;p.ts=Date.now()-n*7*6e4;n++}}}
 }catch(e){toast(errT(e))}
 if(!n&&!S.posts.some(p=>p.tr===t.id))n=localPosts(t);
 GP[t.id]=0;t.gen=1;save();if(V.n==='trend')trendPaint()}
