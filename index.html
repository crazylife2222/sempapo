function stripUser(tx,c){try{const u=String(S.cfg.user||'').trim();if(!u)return tx;const f=u.split(/\s+/)[0],clash=cs(c).some(x=>nrm(x.nome)===nrm(u)||nrm(x.nome.split(' ')[0])===nrm(f));if(clash)return tx;const rx=new RegExp('^[\\s*_]*(?:'+rxe(u)+'|'+rxe(f)+')\\s*:','i');return String(tx).split('\n').filter(l=>!rx.test(l)).join('\n')}catch(e){return tx}}
